<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyCycleWorld</title>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #16181d; --muted: #646b78; --accent: #ff5a1f; --border: #e1e4ea; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e1014; --card: #171a21; --text: #e8eaef; --muted: #949bab; --border: #2a2f3a; } }
    :root[data-theme="dark"] { --bg: #0e1014; --card: #171a21; --text: #e8eaef; --muted: #949bab; --border: #2a2f3a; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 520px; width: 100%; }
    h1 { margin: 0 0 4px; } p { color: var(--muted); }
    a.btn { display: block; text-decoration: none; padding: 12px 16px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); color: var(--text); }
    a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    a.btn small { display: block; opacity: 0.8; font-weight: 400; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚲 MyCycleWorld</h1>
    <p>Un jeu de course façon kart, sur ton vrai vélo : home trainer, cardio et manettes Zwift Play.</p>
    <a class="btn primary" href="diag/">Diagnostic du matériel<small>Vérifie trainer, cardio et manettes</small></a>
    <a class="btn" href="diag/?demo=1">Diagnostic en mode démo<small>Appareils simulés, sans vélo</small></a>
  </div>
</body>
</html>
